# Run the keeper on anything with Docker — a home server does the job.
#
#   cp keeper/.env.example keeper/.env      and fill it in
#   docker compose -f keeper/docker-compose.yml up -d
#
# Build context is the repository root so the image can copy from `keeper/`, which keeps
# this file next to the thing it runs rather than at the top of the tree.
services:
  keeper:
    build:
      context: ..
      dockerfile: keeper/Dockerfile
    env_file: .env
    restart: unless-stopped
    # Outbound only. Nothing listens, so nothing needs exposing.
    network_mode: bridge
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
